; PlatformIO Project Configuration File
;
; Apples & Oranges Sorter — 5-DOF ESP32-S3 CycloiDrive arm firmware.
; Open THIS folder (ao/firmware) in VSCode for PlatformIO to detect the project.
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

; Serial Monitor Options
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter

; ESP32-S3 N16R8 specific (16MB Flash, 8MB PSRAM) and Serial via USB config
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

; Library dependencies required by main.cpp
lib_deps =
	waspinator/AccelStepper@^1.64
	madhephaestus/ESP32Servo@^3.0.5
